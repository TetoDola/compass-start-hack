name: compass
services:
  openbb:
    build: ./deploy/openbb
    ports:
      - "127.0.0.1:6900:6900"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6900/openapi.json', timeout=5)"]
      interval: 30s
      timeout: 6s
      start_period: 45s
      retries: 3
